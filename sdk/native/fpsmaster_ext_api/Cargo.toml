# Standalone copy of the fpsmaster native plugin ABI, bundled so the SDK builds
# without crates.io. It is a snapshot of the repo's `crates/fpsmaster_ext_api`;
# the template/example depend on it via a relative path.
[package]
name = "fpsmaster_ext_api"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Stable plugin ABI for fpsmaster native (cdylib) extensions."
readme = "README.md"

[dependencies]
abi_stable = "0.11"
