[package]
name = "my_native_mod"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Bundled with this SDK (no crates.io needed). To move the mod elsewhere, copy
# the `fpsmaster_ext_api/` folder along with it, or switch to a git dependency:
#   fpsmaster_ext_api = { git = "https://github.com/FPSMasterTeam/FPSMaster-Extreme" }
fpsmaster_ext_api = { path = "../fpsmaster_ext_api" }
# abi_stable's macros expand to `::abi_stable` paths, so depend on it directly at
# the same version fpsmaster_ext_api uses.
abi_stable = "0.11"
