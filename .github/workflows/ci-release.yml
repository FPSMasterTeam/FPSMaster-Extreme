name: Extreme CI Release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  PRODUCT_CODE: extreme

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.channel.outputs.should_publish }}
      channel: ${{ steps.channel.outputs.channel }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      version_name: ${{ steps.meta.outputs.version_name }}
      changelog: ${{ steps.meta.outputs.changelog }}
      commit_hash: ${{ steps.meta.outputs.commit_hash }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release channel
        id: channel
        shell: bash
        run: |
          # Extreme only ships release tags: v1.0.0 (no -beta / prerelease).
          channel=""
          should_publish="false"

          # Publish exclusively from release tags (branch pushes only build).
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version_name="${GITHUB_REF_NAME#v}"
            if [[ ! "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Extreme only accepts release tags like v1.2.3 (got ${GITHUB_REF_NAME})" >&2
              exit 1
            fi
            channel="release"
            should_publish="true"
          fi

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            should_publish="false"
          fi

          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "should_publish=$should_publish" >> "$GITHUB_OUTPUT"

      - name: Capture release metadata
        id: meta
        shell: bash
        run: |
          commit_hash="$(printf '%s' "$GITHUB_SHA" | tr '[:upper:]' '[:lower:]')"
          short_sha="${commit_hash:0:8}"
          should_publish="${{ steps.channel.outputs.should_publish }}"

          if [ "$should_publish" = "true" ]; then
            version_name="${GITHUB_REF_NAME#v}"
            release_tag="${GITHUB_REF_NAME}"
          else
            base_version="$(grep -m1 '^version' crates/fpsmaster_app/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
            version_name="${base_version}-ci.${GITHUB_RUN_NUMBER}+${short_sha}"
            release_tag="extreme-${version_name}"
          fi

          echo "commit_hash=$commit_hash" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          changelog="$(git log -1 --pretty=format:'%s%n%n%b')"
          {
            echo "changelog<<EOF"
            printf '%s\n' "$changelog"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved Extreme version: $version_name (publish=$should_publish)"

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x86_64
            os: windows-latest
          - target: linux-x86_64
            os: ubuntu-22.04
          - target: macos-aarch64
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config cmake \
            libasound2-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libwayland-dev libxkbcommon-dev libudev-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust target
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Test workspace
        if: runner.os == 'Linux'
        run: cargo test --workspace --locked

      - name: Configure ad-hoc signing for non-release macOS builds
        if: matrix.target == 'macos-aarch64' && needs.resolve.outputs.should_publish != 'true'
        run: echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        if: matrix.target == 'macos-aarch64' && needs.resolve.outputs.should_publish == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Required macOS signing secret is missing: $name"
              exit 1
            fi
          done
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          identity="$(security find-identity -v -p codesigning build.keychain | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$identity" ]; then
            echo "::error::No Developer ID Application identity found in imported certificate"
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build launcher package
        shell: bash
        run: scripts/package-launcher.sh --target ${{ matrix.target }}

      - name: Verify Linux glibc baseline
        if: matrix.target == 'linux-x86_64'
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import subprocess

          binary = "target/release/fpsmaster_app"
          versions = [
              tuple(map(int, value.split(b".")))
              for value in re.findall(
                  rb"GLIBC_([0-9]+\.[0-9]+)",
                  subprocess.check_output(["readelf", "--version-info", binary]),
              )
          ]
          maximum = max(versions, default=(0, 0))
          print(f"Maximum required glibc: {maximum[0]}.{maximum[1]}")
          if maximum > (2, 35):
              raise SystemExit("Linux artifact exceeds the Ubuntu 22.04 glibc 2.35 baseline")
          PY

      - name: Notarize macOS release binary
        if: matrix.target == 'macos-aarch64' && needs.resolve.outputs.should_publish == 'true'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Required macOS notarization secret is missing: $name"
              exit 1
            fi
          done
          binary="target/release/fpsmaster_app"
          codesign --verify --strict --verbose=2 "$binary"
          sign_info="$(codesign --display --verbose=4 "$binary" 2>&1)"
          printf '%s\n' "$sign_info"
          if ! printf '%s\n' "$sign_info" | grep -q '^Authority=Developer ID Application:'; then
            echo "::error::Release binary is not signed with a Developer ID Application certificate"
            exit 1
          fi
          ditto -c -k --keepParent "$binary" notarization.zip
          xcrun notarytool submit notarization.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

      - name: Remove temporary signing keychain
        if: always() && matrix.target == 'macos-aarch64' && needs.resolve.outputs.should_publish == 'true'
        run: security delete-keychain build.keychain || true

      # Guard: release tarballs must never ship the dev-only extensions (mods/,
      # incl. a scaffold/auto-aim cheat) or the extension SDK (sdk/). Fail hard
      # if they ever creep back in — end users get a clean client only.
      - name: Verify package excludes dev extensions + SDK
        shell: bash
        run: |
          tarball="$(ls dist-launcher/FPSMaster-Extreme-*-${{ matrix.target }}.tar.gz)"
          if tar -tzf "$tarball" | sed 's|^\./||' | grep -qiE '^(mods|sdk)/'; then
            echo "::error::release package must not bundle mods/ or sdk/" >&2
            tar -tzf "$tarball" | sed 's|^\./||' | grep -iE '^(mods|sdk)/' >&2
            exit 1
          fi
          echo "ok: $tarball ships no mods/ or sdk/"

      - name: Capture artifact metadata
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          tarball="$(ls dist-launcher/FPSMaster-Extreme-*-${TARGET}.tar.gz)"
          checksum="$(cut -d' ' -f1 "${tarball}.sha256")"
          if command -v stat >/dev/null 2>&1 && stat -c%s "$tarball" >/dev/null 2>&1; then
            size="$(stat -c%s "$tarball")"      # GNU stat (Linux)
          else
            size="$(stat -f%z "$tarball")"      # BSD stat (macOS)
          fi
          mkdir -p build-meta
          printf '{"target":"%s","assetName":"%s","checksum":"%s","fileSize":%s}\n' \
            "$TARGET" "$(basename "$tarball")" "$checksum" "$size" \
            > "build-meta/${TARGET}.json"
          cat "build-meta/${TARGET}.json"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extreme-build-${{ matrix.target }}
          path: |
            dist-launcher/FPSMaster-Extreme-*-${{ matrix.target }}.tar.gz
            dist-launcher/FPSMaster-Extreme-*-${{ matrix.target }}.manifest.json
            build-meta/${{ matrix.target }}.json
          if-no-files-found: error

  publish:
    needs:
      - resolve
      - build
    if: github.event_name != 'pull_request' && needs.resolve.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: extreme-build-*
          path: dist
          merge-multiple: true

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p release-dist
          find dist -type f \( -name '*.tar.gz' -o -name '*.manifest.json' -o -name '*.json' \) \
            -exec cp '{}' release-dist/ \;
          find release-dist -maxdepth 1 -type f -print

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Extreme ${{ needs.resolve.outputs.version_name }}
          body: ${{ needs.resolve.outputs.changelog }}
          files: |
            release-dist/*.tar.gz
            release-dist/*.manifest.json
          fail_on_unmatched_files: true

      - name: Upload to Qiniu OSS and notify release API
        shell: bash
        env:
          FPSMASTER_CI_API_BASE_URL: ${{ secrets.FPSMASTER_CI_API_BASE_URL }}
          FPSMASTER_CI_UPLOAD_TOKEN: ${{ secrets.FPSMASTER_CI_UPLOAD_TOKEN }}
          QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY }}
          QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY }}
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
          QINIU_S3_ENDPOINT: ${{ secrets.QINIU_S3_ENDPOINT }}
          QINIU_S3_REGION: ${{ secrets.QINIU_S3_REGION }}
          QINIU_CDN_BASE_URL: ${{ secrets.QINIU_CDN_BASE_URL }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          VERSION_NAME: ${{ needs.resolve.outputs.version_name }}
          COMMIT_HASH: ${{ needs.resolve.outputs.commit_hash }}
          CHANGELOG: ${{ needs.resolve.outputs.changelog }}
        run: |
          if [ -z "$FPSMASTER_CI_API_BASE_URL" ] || [ -z "$FPSMASTER_CI_UPLOAD_TOKEN" ]; then
            echo "Release API secrets are not configured" >&2
            exit 1
          fi
          if [ -z "$QINIU_ACCESS_KEY" ] || [ -z "$QINIU_SECRET_KEY" ] || [ -z "$QINIU_BUCKET" ] || [ -z "$QINIU_S3_ENDPOINT" ] || [ -z "$QINIU_CDN_BASE_URL" ]; then
            echo "Qiniu OSS secrets are not configured" >&2
            exit 1
          fi

          python3 -m pip install --quiet --user boto3

          shopt -s nullglob
          metadata_files=(release-dist/*.json)
          # exclude the per-target manifest.json emitted by the package script
          for metadata_path in "${metadata_files[@]}"; do
            case "$metadata_path" in *.manifest.json) continue ;; esac

            asset_name="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["assetName"])' "$metadata_path")"
            target="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["target"])' "$metadata_path")"
            checksum="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["checksum"])' "$metadata_path")"
            file_size="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["fileSize"])' "$metadata_path")"
            artifact_path="release-dist/$asset_name"
            if [ ! -f "$artifact_path" ]; then
              echo "Artifact listed by metadata was not found: $artifact_path" >&2
              exit 1
            fi

            object_key="extreme/${CHANNEL}/${VERSION_NAME}/${COMMIT_HASH}/${target}/${asset_name}"
            export ARTIFACT_PATH="$artifact_path" OBJECT_KEY="$object_key"
            download_url="$(python3 -c "import os,boto3; e=os.environ['QINIU_S3_ENDPOINT'].rstrip('/'); c=os.environ['QINIU_CDN_BASE_URL'].rstrip('/'); b=os.environ['QINIU_BUCKET']; k=os.environ['OBJECT_KEY']; p=os.environ['ARTIFACT_PATH']; client=boto3.client('s3', endpoint_url=e, aws_access_key_id=os.environ['QINIU_ACCESS_KEY'], aws_secret_access_key=os.environ['QINIU_SECRET_KEY'], region_name=os.environ.get('QINIU_S3_REGION') or 'ap-southeast-1'); client.upload_file(p,b,k); print(f'{c}/{k}')")"
            echo "Uploaded ${asset_name} -> ${download_url}"

            export TARGET="$target" CHECKSUM="$checksum" FILE_SIZE="$file_size" DOWNLOAD_URL="$download_url"
            python3 -c 'import json, os; payload = dict(productCode=os.environ["PRODUCT_CODE"], channelCode=os.environ["CHANNEL"], versionName=os.environ["VERSION_NAME"], commitHash=os.environ["COMMIT_HASH"], artifactSourceType="external_url", downloadUrl=os.environ["DOWNLOAD_URL"], fileSize=int(os.environ["FILE_SIZE"]), checksum=os.environ["CHECKSUM"], recommended=True, target=os.environ["TARGET"], changelog=os.environ["CHANGELOG"]); open("payload.json", "w", encoding="utf-8").write(json.dumps(payload, ensure_ascii=False))'

            curl --fail-with-body --show-error --silent \
              -X POST \
              -H "Content-Type: application/json" \
              -H "X-CI-Token: ${FPSMASTER_CI_UPLOAD_TOKEN}" \
              --data @payload.json \
              "${FPSMASTER_CI_API_BASE_URL%/}/api/v1/launcher/releases/ci"
          done
