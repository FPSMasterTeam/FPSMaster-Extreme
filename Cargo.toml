[workspace]
members = [
    "crates/recraft_app",
    "crates/recraft_core",
    "crates/recraft_ext",
    "crates/recraft_ext_api",
    "crates/recraft_native_example",
    "crates/recraft_protocol",
    "crates/recraft_render",
]
resolver = "2"

# Release "obfuscation" baseline. Rust has no true obfuscator; stripping the
# symbol table is the closest primitive and is enough here because native mods
# never reference host symbols — they depend only on `recraft_ext_api`'s checked
# layout. `strip = "symbols"` drops internal names from the host binary while a
# mod cdylib keeps its `recraft_ext_mod` root-module export in the *dynamic*
# symbol table (the loader resolves it there), so stripped release builds still
# load native mods. That dynamic export is the de-facto symbol whitelist.
[profile.release]
strip = "symbols"
lto = "thin"

[workspace.package]
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gaoyu06/MiniCraft"

[workspace.dependencies]
anyhow = "1.0"
arboard = "3.4"
bytemuck = { version = "1.15", features = ["derive"] }
env_logger = "0.11"
flate2 = "1.0"
font8x8 = "0.3"
glam = "0.27"
hickory-resolver = "0.24"
image = { version = "0.25", default-features = false, features = ["png"] }
kira = { version = "0.10", default-features = false, features = ["cpal", "ogg"] }
log = "0.4"
pollster = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
wgpu = "29"
winit = "0.30"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
# Auth / HTTP
ureq = { version = "2.10", features = ["json", "tls"] }
# Crypto (online-mode)
rand = "0.8"
rsa = "0.9"
sha1 = "0.10"
num-bigint = "0.4"
aes = "0.8"
cfb8 = "0.8"
base64 = "0.22"
