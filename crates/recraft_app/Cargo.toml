[package]
name = "recraft_app"
version = "0.3.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
arboard.workspace = true
env_logger.workspace = true
glam.workspace = true
hickory-resolver.workspace = true
kira.workspace = true
log.workspace = true
pollster.workspace = true
recraft_core = { path = "../recraft_core" }
recraft_ext = { path = "../recraft_ext" }
recraft_protocol = { path = "../recraft_protocol" }
recraft_render = { path = "../recraft_render" }
winit.workspace = true
serde_json.workspace = true
ureq.workspace = true
base64.workspace = true
image.workspace = true

[features]
# Pass-through to the renderer's DLSS upscaler so the whole app can be built with
# `cargo run -p recraft_app --features dlss` (needs DLSS_SDK + Vulkan SDK + clang on
# an RTX/Vulkan box — see docs/DLSS.md). Off by default → fully cross-platform.
dlss = ["recraft_render/dlss"]
